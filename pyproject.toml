[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantbot"
version = "0.1.0"
description = "Bot de trading actions multi-facteurs, rebalancement mensuel"
requires-python = ">=3.8"   # teste sur 3.8 et 3.11 ; 3.11+ recommande

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
